<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>일원 오락실 - 땅따먹기 v3</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Noto+Sans+KR:wght@400;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; width: 100%; overflow: hidden; touch-action: none;
    background: #050510; color: #e0f7ff; font-family: 'Noto Sans KR', system-ui, sans-serif;
    font-size: 18px; -webkit-user-select: none; user-select: none;
  }
  #app {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    max-width: 100vw; max-height: 100dvh;
  }
  .screen { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 12px; gap: 16px; }
  .screen.active { display: flex; }
  h1 { font-family: 'Orbitron', 'Noto Sans KR', sans-serif; font-size: 32px; font-weight: 700; color: #00f0ff; text-shadow: 0 0 10px #00f0ff; text-align: center; }
  .subtitle { font-size: 20px; color: #ff00aa; text-shadow: 0 0 8px #ff00aa; }
  .arcade-label { font-size: 16px; color: #ffd700; letter-spacing: 3px; }
  button {
    font-size: 20px; font-weight: 700; padding: 16px 32px; min-width: 200px; min-height: 56px;
    background: transparent; border: 3px solid #00f0ff; color: #00f0ff; border-radius: 12px;
    box-shadow: 0 0 15px rgba(0,240,255,0.5); cursor: pointer; font-family: inherit;
  }
  button.magenta { border-color: #ff00aa; color: #ff00aa; }
  .status-bar {
    display: flex; justify-content: space-around; align-items: center; width: 100%;
    background: rgba(0,20,40,0.9); border: 2px solid #00a0ff; border-radius: 10px;
    padding: 8px 4px; font-size: 18px; flex-shrink: 0;
  }
  .status-item { text-align: center; min-width: 58px; }
  .status-item span { display: block; font-size: 16px; opacity: 0.85; }
  .status-item strong { font-size: 22px; color: #00f0ff; }
  #game-container { flex: 1; width: 100%; display: flex; flex-direction: column; position: relative; min-height: 0; }
  canvas { flex: 1; width: 100%; height: 100%; background: #1a1208; border: 3px solid #00f0ff; border-radius: 8px; display: block; }
  .controls { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; padding: 8px 4px; flex-shrink: 0; gap: 8px; }
  #joystick {
    width: 140px; height: 140px; border-radius: 50%; border: 4px solid #00f0ff;
    background: rgba(0,40,60,0.7); position: relative; touch-action: none;
    box-shadow: 0 0 20px rgba(0,240,255,0.6); flex-shrink: 0;
  }
  #joystick .knob {
    width: 56px; height: 56px; border-radius: 50%; background: #00f0ff;
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    box-shadow: 0 0 15px #00f0ff; pointer-events: none;
  }
  .side-buttons { display: flex; flex-direction: column; gap: 12px; }
  .side-buttons button { min-width: 120px; min-height: 52px; font-size: 18px; padding: 12px; }
  .overlay { position: absolute; inset: 0; background: rgba(0,0,10,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px; z-index: 20; }
  .overlay.active { display: flex; }
  .fee-signal { font-size: 16px; color: #ffd700; text-align: center; }
  #fullscreen-btn { position: absolute; top: 8px; right: 8px; z-index: 10; min-width: auto; padding: 8px 12px; font-size: 16px; }
</style>
</head>
<body>
<div id="app">
  <div id="start-screen" class="screen active">
    <div class="arcade-label">★ 일원 오락실 ★</div>
    <h1>땅따먹기</h1>
    <div class="subtitle">농부와 게의 땅따먹기</div>
    <button id="start-btn">게임 시작</button>
    <button id="exit-start-btn" class="magenta">나가기</button>
    <div class="fee-signal">판당 요금: 500원</div>
    <p style="font-size:16px; text-align:center; max-width:320px; opacity:0.9;">농부가 고랑을 파며 땅을 차지합니다. 홍게와 청게를 피하세요. 점령하면 풍경이 드러납니다.</p>
  </div>

  <div id="game-screen" class="screen">
    <div class="status-bar">
      <div class="status-item"><span>단계</span><strong id="stage">1</strong></div>
      <div class="status-item"><span>영토</span><strong id="territory">0%</strong></div>
      <div class="status-item"><span>목숨</span><strong id="lives">3</strong></div>
      <div class="status-item"><span>목표</span><strong id="goal">75%</strong></div>
      <div class="status-item"><span>요금</span><strong>500원</strong></div>
    </div>
    <div id="game-container">
      <canvas id="gameCanvas"></canvas>
      <div id="pause-overlay" class="overlay">
        <h1 style="font-size:32px;">일시정지</h1>
        <button id="resume-btn">계속하기</button>
        <button id="restart-btn" class="magenta">재시작</button>
      </div>
      <div id="gameover-overlay" class="overlay">
        <h1 id="end-title" style="font-size:32px;">게임 종료</h1>
        <p id="end-msg" style="font-size:20px;">영토 점령률: 0%</p>
        <button id="next-stage-btn" style="display:none;">다음 단계</button>
        <button id="retry-btn">다시 도전</button>
        <button id="to-start-btn" class="magenta">시작 화면</button>
      </div>
    </div>
    <div class="controls">
      <div id="joystick"><div class="knob"></div></div>
      <div class="side-buttons">
        <button id="pause-btn">일시정지</button>
        <button id="exit-game-btn" class="magenta">나가기</button>
      </div>
    </div>
    <div class="fee-signal">판당 요금 신호 활성</div>
  </div>
  <button id="fullscreen-btn" style="display:none;">전체화면</button>
</div>

<script>
// 사진 출처 참고: Unsplash 농촌 풍경 (예: rural landscape, rice fields). 실제 사용 시 라이선스 확인.
// 본 버전은 프로시저럴 풍경 + 흙 덮개로 구현 (외부 이미지 의존 없음).

const GOAL = 75;
const SPEED = 5.2;
const GRID_W = 28, GRID_H = 36;
let board = [];
let player = { x: 0, y: 0, dir: 0 };
let enemies = [];
let lives = 3;
let claimedPct = 0;
let trail = [];
let paused = false;
let gameRunning = false;
let joystick = { active: false, nx: 0, ny: 0, pointerId: null };
let lastTime = 0;
let canvas, ctx, cellSize;
let animTime = 0;
// 단계: 클리어하면 '다음 단계'로 올라감. 3단계부터 새끼 게 등장.
let stage = 1;
const BABY_STAGE = 3;
const BABY_MAX = 8;              // 동시에 살아 있는 새끼 게 최대 수
const BABY_COOLDOWN = 10;        // 같은 홍게·청게 쌍이 다시 낳기까지 (초)
const CRAB_MEET_DIST = 0.7;      // 홍게와 청게가 만났다고 보는 거리
const BABY_HIT_DIST = 0.4;       // 새끼 게와 농부 몸 충돌 거리 (큰 게 0.55)
const BABY_COLORS = ['#facc15', '#22c55e', '#a855f7', '#f97316']; // 노랑·초록·보라·주황
let babies = [];
let pairCooldown = {};           // 'i-j' -> 다시 낳을 수 있는 playTime
let playTime = 0;                // 일시정지·종료 중에는 멈추는 게임 시간
let effects = [];                // 떠오르는 '+' 효과

function initBoard() {
  board = Array.from({length: GRID_H}, () => Array(GRID_W).fill(0));
  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      if (x === 0 || y === 0 || x === GRID_W-1 || y === GRID_H-1) board[y][x] = 1;
    }
  }
  player.x = 0; player.y = Math.floor(GRID_H / 2); player.dir = 0;
  enemies = [
    { x: GRID_W * 0.35, y: GRID_H * 0.35, vx: 1.1, vy: 0.7, type: 'red', legPhase: 0 },
    { x: GRID_W * 0.65, y: GRID_H * 0.65, vx: -0.9, vy: 1.0, type: 'blue', legPhase: Math.PI }
  ];
  trail = [];
  babies = [];
  pairCooldown = {};
  effects = [];
  playTime = 0;
  document.getElementById('stage').textContent = stage;
  updateTerritory();
}

function updateTerritory() {
  let total = GRID_W * GRID_H;
  let claimed = 0;
  for (let y = 0; y < GRID_H; y++) for (let x = 0; x < GRID_W; x++) if (board[y][x] === 1) claimed++;
  claimedPct = Math.round((claimed / total) * 100);
  document.getElementById('territory').textContent = claimedPct + '%';
  if (claimedPct >= GOAL && gameRunning) win();
}

function resizeCanvas() {
  const container = document.getElementById('game-container');
  const rect = container.getBoundingClientRect();
  canvas.width = rect.width * devicePixelRatio;
  canvas.height = rect.height * devicePixelRatio;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  cellSize = Math.min(rect.width / GRID_W, rect.height / GRID_H);
}

function drawLandscape(w, h) {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#87ceeb');
  g.addColorStop(0.45, '#a8d5e5');
  g.addColorStop(0.5, '#6b8e23');
  g.addColorStop(1, '#4a7023');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#5a7a4a';
  ctx.beginPath();
  ctx.moveTo(0, h*0.55); ctx.lineTo(w*0.2, h*0.4); ctx.lineTo(w*0.4, h*0.52); ctx.lineTo(w*0.7, h*0.38); ctx.lineTo(w, h*0.5); ctx.lineTo(w, h*0.6); ctx.lineTo(0, h*0.6); ctx.fill();
  ctx.strokeStyle = 'rgba(90,140,40,0.4)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 20; i++) {
    ctx.beginPath();
    ctx.moveTo(0, h*0.6 + i*8);
    ctx.quadraticCurveTo(w*0.5, h*0.6 + i*8 - 10, w, h*0.6 + i*8 + 5);
    ctx.stroke();
  }
  for (let i = 0; i < 5; i++) {
    const tx = (i * 0.18 + 0.1) * w;
    const ty = h * 0.52;
    ctx.fillStyle = '#2d5016';
    ctx.beginPath(); ctx.arc(tx, ty, 12, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#8b5a2b';
    ctx.fillRect(tx-2, ty, 4, 10);
  }
}

function drawDirtCell(px, py, size) {
  ctx.fillStyle = '#8b5a2b';
  ctx.fillRect(px, py, size, size);
  ctx.fillStyle = '#6b4423';
  for (let i = 0; i < 3; i++) {
    ctx.fillRect(px + Math.random()*size*0.6, py + Math.random()*size*0.6, 2, 2);
  }
}

function drawFurrow(px, py, size) {
  ctx.fillStyle = '#5a3a1a';
  ctx.fillRect(px + size*0.2, py + size*0.35, size*0.6, size*0.3);
  ctx.strokeStyle = '#3a220a';
  ctx.lineWidth = 1;
  ctx.strokeRect(px + size*0.15, py + size*0.3, size*0.7, size*0.4);
}

function drawFarmer(x, y, dir, size) {
  const px = x * size, py = y * size;
  ctx.save();
  ctx.translate(px, py);
  const angle = Math.atan2(dir.y || 0, dir.x || 1);
  ctx.rotate(angle);
  ctx.fillStyle = '#c17a4a';
  ctx.beginPath(); ctx.arc(0, -size*0.25, size*0.18, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#f5d0a0';
  ctx.fillRect(-size*0.08, -size*0.1, size*0.16, size*0.22);
  ctx.fillStyle = '#3a5a1a';
  ctx.fillRect(-size*0.12, size*0.05, size*0.24, size*0.12);
  ctx.fillStyle = '#d4a017';
  ctx.beginPath(); ctx.ellipse(0, -size*0.35, size*0.22, size*0.08, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#5a3a1a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(size*0.1, -size*0.05);
  ctx.lineTo(size*0.35, size*0.15);
  ctx.stroke();
  ctx.fillStyle = '#888';
  ctx.beginPath(); ctx.moveTo(size*0.3, size*0.1); ctx.lineTo(size*0.42, size*0.18); ctx.lineTo(size*0.28, size*0.22); ctx.fill();
  ctx.restore();
}

function drawCrab(e, cell) {
  const px = e.x * cell, py = e.y * cell;
  const color = e.color || (e.type === 'red' ? '#e63946' : '#1d4ed8');
  const scale = e.scale || 1;      // 새끼 게는 작게
  const size = cell * scale;
  const phase = animTime * (e.legSpeed || 8) + e.legPhase;
  ctx.save();
  ctx.translate(px, py);
  const ang = Math.atan2(e.vy, e.vx);
  ctx.rotate(ang);
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.ellipse(0, 0, size*0.32, size*0.22, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-size*0.1, -size*0.08, size*0.05, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(size*0.1, -size*0.08, size*0.05, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(-size*0.1, -size*0.08, size*0.025, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(size*0.1, -size*0.08, size*0.025, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(1, 2.5 * scale);
  ctx.beginPath(); ctx.moveTo(-size*0.25, -size*0.05); ctx.lineTo(-size*0.4, -size*0.15); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(size*0.25, -size*0.05); ctx.lineTo(size*0.4, -size*0.15); ctx.stroke();
  for (let i = 0; i < 3; i++) {
    const side = i % 2 === 0 ? 1 : -1;
    const offset = Math.sin(phase + i) * size * 0.08;
    ctx.beginPath();
    ctx.moveTo(side * size*0.1, size*0.05);
    ctx.lineTo(side * size*0.28, size*0.18 + offset);
    ctx.stroke();
  }
  ctx.restore();
}

function drawEffects() {
  effects.forEach(f => {
    const a = Math.max(0, 1 - f.t / 1.0);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = '#fff200';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.font = `bold ${Math.round(cellSize * 1.4)}px sans-serif`;
    ctx.textAlign = 'center';
    const px = f.x * cellSize, py = (f.y - f.t * 1.5) * cellSize;
    ctx.strokeText(f.text, px, py);
    ctx.fillText(f.text, px, py);
    ctx.restore();
  });
}

function draw() {
  // 시작 화면에서는 board가 비어 있어 첫 프레임에서 오류가 나고 requestAnimationFrame 루프가 멈췄음
  if (!ctx || !board.length) return;
  const w = canvas.width / devicePixelRatio;
  const h = canvas.height / devicePixelRatio;
  ctx.clearRect(0, 0, w, h);

  drawLandscape(w, h);

  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      const px = x * cellSize, py = y * cellSize;
      if (board[y][x] === 0) {
        drawDirtCell(px, py, cellSize);
      } else if (board[y][x] === 2) {
        drawFurrow(px, py, cellSize);
      }
    }
  }

  enemies.forEach(e => drawCrab(e, cellSize));
  babies.forEach(b => drawCrab(b, cellSize));
  drawEffects();

  const dir = { x: joystick.nx || 1, y: joystick.ny || 0 };
  drawFarmer(player.x, player.y, dir, cellSize);
}

function isValid(x, y) { return x >= 0 && x < GRID_W && y >= 0 && y < GRID_H; }

function markTrail(cx, cy) {
  if (!isValid(cx, cy)) return false;
  if (board[cy][cx] === 1) return true;
  if (board[cy][cx] === 2) return false;
  board[cy][cx] = 2;
  trail.push([cx, cy]);
  return false;
}

// 큰 게(홍게·청게)가 고랑(선) 칸 위에 있는지. 새끼 게는 고랑을 무시한다.
function bigCrabOnTrail() {
  return enemies.some(e => {
    const cx = Math.round(e.x), cy = Math.round(e.y);
    return isValid(cx, cy) && board[cy][cx] === 2;
  });
}

function movePlayer(dt) {
  if (!joystick.active || paused || !gameRunning) return;
  const dx = joystick.nx * SPEED * dt;
  const dy = joystick.ny * SPEED * dt;
  const dist = Math.hypot(dx, dy);
  const steps = Math.max(1, Math.ceil(dist * 2));
  for (let i = 1; i <= steps; i++) {
    const nx = player.x + (dx / steps);
    const ny = player.y + (dy / steps);
    const cx = Math.round(nx);
    const cy = Math.round(ny);
    if (!isValid(cx, cy)) continue;
    for (const e of enemies) {
      if (Math.hypot(nx - e.x, ny - e.y) < 0.55) { loseLife(); return; }
    }
    for (const b of babies) {
      if (Math.hypot(nx - b.x, ny - b.y) < BABY_HIT_DIST) { loseLife(); return; }
    }
    if (board[cy][cx] === 2 && (cx !== Math.round(player.x) || cy !== Math.round(player.y))) {
      loseLife(); return;
    }
    const hitClaimed = markTrail(cx, cy);
    player.x = nx; player.y = ny;
    // 길이와 상관없이 내 땅에 돌아오면 선을 정리 (짧은 선이 판에 남는 버그 수정)
    if (hitClaimed && trail.length > 0) {
      // 고전 규칙: 점령 순간 큰 게가 고랑 위에 있으면 점령하지 않고 죽음
      if (bigCrabOnTrail()) { loseLife(); return; }
      claimArea();
      break;
    }
  }
}

function claimArea() {
  const visited = Array.from({length: GRID_H}, () => Array(GRID_W).fill(false));
  const queue = [];
  // 적이 있는 칸은 상태(빈칸/선/내 땅)와 상관없이 시작점으로 삼는다.
  // 예전에는 빈칸일 때만 넣어서, 적이 선이나 내 땅 칸 위에 있으면 시작점이 없어 판 전체가 점령됐다.
  enemies.forEach(e => {
    const ex = Math.round(e.x), ey = Math.round(e.y);
    if (isValid(ex, ey) && !visited[ey][ex]) { queue.push([ex, ey]); visited[ey][ex] = true; }
  });
  // 시작점이 하나도 없으면 둘러싼 영역 판정을 할 수 없으므로 선만 내 땅으로 바꾼다.
  const hasSeed = queue.length > 0;
  // 4방향 탐색: 8방향이면 대각선으로만 이어진 선의 틈으로 새어 나가 점령이 안 됨
  const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  while (queue.length) {
    const [x, y] = queue.shift();
    for (const [dx, dy] of dirs) {
      const nx = x + dx, ny = y + dy;
      if (isValid(nx, ny) && !visited[ny][nx] && board[ny][nx] === 0) {
        visited[ny][nx] = true;
        queue.push([nx, ny]);
      }
    }
  }
  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      if (board[y][x] === 2 || (hasSeed && board[y][x] === 0 && !visited[y][x])) {
        board[y][x] = 1;
      }
    }
  }
  trail = [];
  removeEnclosedBabies();
  updateTerritory();
}

// 새로 점령된 땅 안에 들어간 새끼 게는 사라지고 '+' 보너스 효과를 띄운다.
// (현재 점수 시스템이 없어서 효과만 표시)
function removeEnclosedBabies() {
  babies = babies.filter(b => {
    const cx = Math.round(b.x), cy = Math.round(b.y);
    if (isValid(cx, cy) && board[cy][cx] === 1) {
      effects.push({ x: b.x, y: b.y, t: 0, text: '+' });
      return false;
    }
    return true;
  });
}

function updateEnemies(dt) {
  if (paused) return;
  enemies.forEach(e => {
    e.x += e.vx * dt * 1.4;
    e.y += e.vy * dt * 1.4;
    e.legPhase += dt * 6;
    if (e.x < 1.2 || e.x > GRID_W-2.2) e.vx *= -1;
    if (e.y < 1.2 || e.y > GRID_H-2.2) e.vy *= -1;
    const cx = Math.round(e.x), cy = Math.round(e.y);
    if (isValid(cx, cy) && board[cy][cx] === 1) {
      e.vx *= -1; e.vy *= -1;
      e.x += e.vx * 0.4; e.y += e.vy * 0.4;
    }
    if (isValid(cx, cy) && board[cy][cx] === 2) loseLife();
  });
  spawnBabies();
  updateBabies(dt);
}

// 3단계부터: 홍게(암)와 청게(수)가 만나면 그 자리에 새끼 게 2마리
function spawnBabies() {
  if (stage < BABY_STAGE) return;
  for (let i = 0; i < enemies.length; i++) {
    for (let j = i + 1; j < enemies.length; j++) {
      const a = enemies[i], b = enemies[j];
      if (a.type === b.type) continue;                   // 홍게-청게 쌍만
      if (Math.hypot(a.x - b.x, a.y - b.y) >= CRAB_MEET_DIST) continue;
      const key = i + '-' + j;
      if (pairCooldown[key] !== undefined && playTime < pairCooldown[key]) continue;
      const room = BABY_MAX - babies.length;
      if (room <= 0) continue;                           // 최대 수 초과 금지
      const colors = BABY_COLORS.slice().sort(() => Math.random() - 0.5);
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      for (let k = 0; k < Math.min(2, room); k++) {
        const ang = Math.random() * Math.PI * 2;
        const sp = 1.4 + Math.random() * 0.6;
        babies.push({ x: mx, y: my, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
          type: 'baby', color: colors[k], scale: 0.7, legSpeed: 14, legPhase: Math.random() * 6 });
      }
      pairCooldown[key] = playTime + BABY_COOLDOWN;
    }
  }
}

// 새끼 게: 큰 게보다 조금 빠르고 방향이 자주 흔들림. 고랑은 무시, 내 땅·테두리에서 튕김.
function updateBabies(dt) {
  babies.forEach(e => {
    const turn = (Math.random() - 0.5) * 3 * dt;       // 불규칙한 방향 변화
    const c = Math.cos(turn), s2 = Math.sin(turn);
    const vx = e.vx * c - e.vy * s2, vy = e.vx * s2 + e.vy * c;
    e.vx = vx; e.vy = vy;
    e.x += e.vx * dt * 1.4;
    e.y += e.vy * dt * 1.4;
    e.legPhase += dt * 6;
    if (e.x < 1.2 || e.x > GRID_W-2.2) { e.vx *= -1; e.x = Math.min(Math.max(e.x, 1.2), GRID_W-2.2); }
    if (e.y < 1.2 || e.y > GRID_H-2.2) { e.vy *= -1; e.y = Math.min(Math.max(e.y, 1.2), GRID_H-2.2); }
    const cx = Math.round(e.x), cy = Math.round(e.y);
    if (isValid(cx, cy) && board[cy][cx] === 1) {
      e.vx *= -1; e.vy *= -1;
      e.x += e.vx * 0.4; e.y += e.vy * 0.4;
    }
  });
}

// 조이스틱을 놓고 서 있을 때도 적과 몸이 닿으면 목숨 감소
function checkPlayerHit() {
  if (!gameRunning || paused) return false;
  for (const e of enemies) {
    if (Math.hypot(player.x - e.x, player.y - e.y) < 0.55) { loseLife(); return true; }
  }
  for (const b of babies) {
    if (Math.hypot(player.x - b.x, player.y - b.y) < BABY_HIT_DIST) { loseLife(); return true; }
  }
  return false;
}

function loseLife() {
  lives--;
  document.getElementById('lives').textContent = lives;
  trail.forEach(([x,y]) => { if (board[y][x] === 2) board[y][x] = 0; });
  trail = [];
  player.x = 0; player.y = Math.floor(GRID_H / 2);
  if (lives <= 0) gameOver(false);
}

function win() { gameOver(true); }
function gameOver(won) {
  gameRunning = false;
  document.getElementById('end-title').textContent = won ? '클리어!' : '게임 오버';
  document.getElementById('end-msg').textContent = `${stage}단계 영토 점령률: ${claimedPct}%`;
  document.getElementById('next-stage-btn').style.display = won ? 'block' : 'none';
  document.getElementById('gameover-overlay').classList.add('active');
}

function gameLoop(ts) {
  if (!lastTime) lastTime = ts;
  const dt = Math.min(0.05, (ts - lastTime) / 1000);
  lastTime = ts;
  animTime += dt;
  effects.forEach(f => { f.t += dt; });
  effects = effects.filter(f => f.t < 1.0);
  if (gameRunning && !paused) {
    playTime += dt;
    movePlayer(dt);
    updateEnemies(dt);
    checkPlayerHit();
  }
  draw();
  requestAnimationFrame(gameLoop);
}

const joyEl = document.getElementById('joystick');
const knob = joyEl.querySelector('.knob');
function setJoystick(clientX, clientY) {
  const rect = joyEl.getBoundingClientRect();
  const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
  let dx = clientX - cx, dy = clientY - cy;
  const maxR = rect.width / 2 - 10;
  const dist = Math.hypot(dx, dy);
  if (dist > maxR) { dx = dx / dist * maxR; dy = dy / dist * maxR; }
  knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  const nd = Math.hypot(dx, dy);
  if (nd > 15) {
    joystick.nx = dx / nd;
    joystick.ny = dy / nd;
    joystick.active = true;
  } else {
    joystick.nx = 0; joystick.ny = 0; joystick.active = false;
  }
}
function resetJoystick() {
  joystick.active = false; joystick.nx = 0; joystick.ny = 0; joystick.pointerId = null;
  knob.style.transform = 'translate(-50%, -50%)';
}
joyEl.addEventListener('pointerdown', e => {
  if (joystick.pointerId !== null) return;
  joystick.pointerId = e.pointerId;
  joyEl.setPointerCapture(e.pointerId);
  setJoystick(e.clientX, e.clientY);
  e.preventDefault();
});
joyEl.addEventListener('pointermove', e => {
  if (e.pointerId !== joystick.pointerId) return;
  setJoystick(e.clientX, e.clientY);
  e.preventDefault();
});
function endPointer(e) {
  if (e.pointerId !== joystick.pointerId) return;
  resetJoystick();
}
joyEl.addEventListener('pointerup', endPointer);
joyEl.addEventListener('pointercancel', endPointer);
joyEl.addEventListener('pointerleave', e => { if (e.pointerId === joystick.pointerId) resetJoystick(); });

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

  stage = 1;

  showScreen('game-screen');

  document.getElementById('fullscreen-btn').style.display = 'block';
};
document.getElementById('exit-start-btn').onclick = () => {
  if (confirm('게임을 종료하시겠습니까?')) window.close() || history.back();
};
document.getElementById('exit-game-btn').onclick = () => {
  if (confirm('게임을 나가시겠습니까?')) {
    gameRunning = false;
    showScreen('start-screen');
    document.getElementById('fullscreen-btn').style.display = 'none';
  }
};
document.getElementById('pause-btn').onclick = () => {
  paused = true;
  document.getElementById('pause-overlay').classList.add('active');
};
document.getElementById('resume-btn').onclick = () => {
  paused = false;
  document.getElementById('pause-overlay').classList.remove('active');
};
document.getElementById('restart-btn').onclick = () => {
  document.getElementById('pause-overlay').classList.remove('active');
  document.getElementById('start-btn').click();
};
// 클리어 후 다음 단계: 목숨은 그대로, 판만 새로
document.getElementById('next-stage-btn').onclick = () => {
  stage++;
  initBoard();
  gameRunning = true; paused = false;
  document.getElementById('gameover-overlay').classList.remove('active');
};
document.getElementById('retry-btn').onclick = () => document.getElementById('start-btn').click();
document.getElementById('to-start-btn').onclick = () => {
  showScreen('start-screen');
  document.getElementById('fullscreen-btn').style.display = 'none';
};

const fsBtn = document.getElementById('fullscreen-btn');
fsBtn.onclick = () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
    fsBtn.textContent = '나가기';
  } else {
    document.exitFullscreen();
    fsBtn.textContent = '전체화면';
  }
};
document.addEventListener('fullscreenchange', () => {
  fsBtn.textContent = document.fullscreenElement ? '나가기' : '전체화면';
});
if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) {
  fsBtn.style.display = 'none';
}

window.addEventListener('popstate', () => {
  if (gameRunning) {
    history.pushState(null, '', '');
    document.getElementById('exit-game-btn').click();
  }
});
history.pushState(null, '', '');

canvas = document.getElementById('gameCanvas');
ctx = canvas.getContext('2d');
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));
requestAnimationFrame(gameLoop);
console.log('일원 오락실 땅따먹기 v3.0 - 농부/게/풍경 공개');
